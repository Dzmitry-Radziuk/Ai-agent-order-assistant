stages:
  - build
  - lint
  - scan
  - deploy

variables:
  PROJECT_NAME: auto-snab-orders-assistant
  IMAGE_NAME: cr.yandex/${YC_REGISTRY_BACK_ID}/${PROJECT_NAME}
  CONTAINER_NAME: auto-snab-orders-assistant
  NETWORK_NAME: auto-snab
  DEPLOY_PORT: "8002"
  CONTAINER_PORT: "8000"

include:
  - project: 'antipov-devops/ci-templates'
    file: '/build-hatch.yml'
    ref: main
  - project: 'antipov-devops/ci-templates'
    file: '/security-scan.yml'
    ref: main
  - project: 'antipov-devops/ci-templates'
    file: '/docker-build.yml'
    ref: main
  - project: 'antipov-devops/ci-templates'
    file: '/deploy.yml'
    ref: main

.deploy-google-secret: &deploy-google-secret |
  install -d -m 700 secrets
  GOOGLE_SA_FILE="${GOOGLE_SERVICE_ACCOUNT_JSON_DEV:-${GOOGLE_SERVICE_ACCOUNT_JSON:-}}"
  if [ -z "$GOOGLE_SA_FILE" ] && [ -n "${CI_ENVIRONMENT_NAME:-}" ]; then
    case "$CI_ENVIRONMENT_NAME" in
      dev|develop|development)
        GOOGLE_SA_FILE="${GOOGLE_SERVICE_ACCOUNT_JSON_DEV:-${GOOGLE_SERVICE_ACCOUNT_JSON:-}}"
        ;;
      prod|production)
        GOOGLE_SA_FILE="${GOOGLE_SERVICE_ACCOUNT_JSON_PROD:-${GOOGLE_SERVICE_ACCOUNT_JSON:-}}"
        ;;
    esac
  fi
  if [ -n "$GOOGLE_SA_FILE" ]; then
    test -f "$GOOGLE_SA_FILE"
    install -m 600 "$GOOGLE_SA_FILE" secrets/google-service-account.json
    test -s secrets/google-service-account.json
  fi

deploy-dev:
  before_script:
    - *deploy-google-secret

deploy-prod:
  before_script:
    - *deploy-google-secret
