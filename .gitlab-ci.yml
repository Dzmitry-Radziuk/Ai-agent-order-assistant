stages:
  - quality
  - test
  - documentation

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"

variables:
  GIT_DEPTH: "0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

default:
  interruptible: true
  tags:
    - dev

.python-job:
  image: python:3.12-slim
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip/
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"

lint:
  extends: .python-job
  stage: quality
  script:
    - python -m ruff format --check src tests alembic scripts
    - python -m ruff check src tests alembic scripts
    - python -m mypy src scripts

compose-config:
  image: docker:27-cli
  stage: quality
  before_script: []
  script:
    - cp .env.example .env
    - docker compose -f docker-compose.yml config --quiet
    - docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

tests:
  extends: .python-job
  stage: test
  script:
    - >-
      python -m pytest
      --cov=restaurant_bot
      --cov-fail-under=84
      --cov-report=term-missing
      --cov-report=xml:coverage.xml
      --junitxml=pytest-report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: pytest-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

documentation:
  image: python:3.12-slim
  stage: documentation
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
  script:
    - python scripts/check_docs_updated.py
    - python scripts/check_markdown_links.py

c4-architecture:
  image:
    name: structurizr/structurizr:2026.06.28-noble
    entrypoint: [""]
  stage: documentation
  before_script: []
  script:
    - >-
      java -jar /usr/local/structurizr.war validate
      -workspace "$CI_PROJECT_DIR/docs/architecture/c4/workspace.dsl"
    - >-
      java -jar /usr/local/structurizr.war inspect
      -workspace "$CI_PROJECT_DIR/docs/architecture/c4/workspace.dsl"
    - mkdir -p /tmp/c4-diagrams
    - >-
      java -jar /usr/local/structurizr.war export
      -workspace "$CI_PROJECT_DIR/docs/architecture/c4/workspace.dsl"
      -format mermaid
      -output /tmp/c4-diagrams
    - diff -ru "$CI_PROJECT_DIR/docs/architecture/c4/diagrams" /tmp/c4-diagrams
