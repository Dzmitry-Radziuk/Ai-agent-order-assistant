stages:
  - build
  - lint
  - scan
  - deploy

variables:
  PROJECT_NAME: auto-snab-orders-assistant
  IMAGE_NAME: cr.yandex/${YC_REGISTRY_BACK_ID}/${PROJECT_NAME}
  CONTAINER_NAME: auto-snab-orders-assistant
  NETWORK_NAME: auto-snab
  DEPLOY_PORT: "8002"
  CONTAINER_PORT: "8000"

include:
  - project: 'antipov-devops/ci-templates'
    file: '/build-hatch.yml'
    ref: main
  - project: 'antipov-devops/ci-templates'
    file: '/security-scan.yml'
    ref: main
  - project: 'antipov-devops/ci-templates'
    file: '/docker-build.yml'
    ref: main
  - project: 'antipov-devops/ci-templates'
    file: '/deploy.yml'
    ref: main
