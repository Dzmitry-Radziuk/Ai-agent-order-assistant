stages:
  - quality
  - test
  - documentation
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"

variables:
  SERVICE: "restaurant-procurement-bot"
  CI_DEV_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/dev"
  CI_PROD_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/prod"
  DEV_ENV: "dev"
  PROD_ENV: "prod"
  BUILD_TAG: "build-did"
  DEV_TAG: "group-deploy-shell"
  PROD_TAG: "server-a-shell"
  DEV_COMPOSE_PROJECT: "restaurant-bot-dev"
  PROD_COMPOSE_PROJECT: "restaurant-bot-prod"
  GIT_DEPTH: "0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

default:
  interruptible: true
  tags:
    - dev

.python-job:
  image: python:3.12-slim
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip/
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"

lint:
  extends: .python-job
  stage: quality
  script:
    - python -m ruff format --check src tests alembic scripts
    - python -m ruff check src tests alembic scripts
    - python -m mypy src scripts

compose-config:
  image: docker:27-cli
  stage: quality
  before_script: []
  script:
    - cp .env.example .env
    - docker compose -f docker-compose.yml config --quiet
    - docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

tests:
  extends: .python-job
  stage: test
  script:
    - >-
      python -m pytest
      --cov=restaurant_bot
      --cov-fail-under=84
      --cov-report=term-missing
      --cov-report=xml:coverage.xml
      --junitxml=pytest-report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: pytest-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

documentation:
  image: python:3.12-slim
  stage: documentation
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
  script:
    - python scripts/check_docs_updated.py
    - python scripts/check_markdown_links.py

c4-architecture:
  image:
    name: structurizr/structurizr:2026.06.28-noble
    entrypoint: [""]
  stage: documentation
  before_script: []
  script:
    - >-
      java -jar /usr/local/structurizr.war validate
      -workspace "$CI_PROJECT_DIR/docs/architecture/c4/workspace.dsl"
    - >-
      java -jar /usr/local/structurizr.war inspect
      -workspace "$CI_PROJECT_DIR/docs/architecture/c4/workspace.dsl"
    - mkdir -p /tmp/c4-diagrams
    - >-
      java -jar /usr/local/structurizr.war export
      -workspace "$CI_PROJECT_DIR/docs/architecture/c4/workspace.dsl"
      -format mermaid
      -output /tmp/c4-diagrams
    - diff -ru "$CI_PROJECT_DIR/docs/architecture/c4/diagrams" /tmp/c4-diagrams

build:
  image: docker:24.0.6
  stage: build
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        DOCKER_IMAGE: "$CI_DEV_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        DOCKER_IMAGE_LATEST: "$CI_DEV_REGISTRY_IMAGE:latest"
    - if: '$CI_COMMIT_TAG =~ /^v.+/'
      variables:
        DOCKER_IMAGE: "$CI_PROD_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        DOCKER_IMAGE_LATEST: "$CI_PROD_REGISTRY_IMAGE:latest"
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
    AWS_ACCESS_KEY_ID: "$YC_S3_ACCESS_KEY"
    AWS_SECRET_ACCESS_KEY: "$YC_S3_SECRET_KEY"
    AWS_DEFAULT_REGION: "ru-central1"
    AWS_ENDPOINT_URL: "$YC_S3_ENDPOINT_URL"
    S3_BUCKET_NAME: "$YC_S3_BUCKET_NAME"
    BUILDKIT_PROGRESS: "plain"
  before_script:
    - apk add --no-cache aws-cli
    - test -n "$YC_S3_ACCESS_KEY"
    - test -n "$YC_S3_SECRET_KEY"
    - test -n "$YC_S3_ENDPOINT_URL"
    - test -n "$YC_S3_BUCKET_NAME"
    - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set default.region "$AWS_DEFAULT_REGION"
    - aws configure set default.s3.endpoint_url "$AWS_ENDPOINT_URL"
    - aws --endpoint-url "$AWS_ENDPOINT_URL" s3 ls "s3://$S3_BUCKET_NAME"
    - docker buildx create --name "restaurant-bot-$CI_JOB_ID" --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - >-
      docker buildx build
      --push
      --platform linux/amd64
      -f Dockerfile
      -t "$DOCKER_IMAGE"
      -t "$DOCKER_IMAGE_LATEST"
      --cache-to "type=s3,bucket=$S3_BUCKET_NAME,name=$SERVICE-cache-$CI_COMMIT_REF_SLUG,mode=max,compression=zstd,region=$AWS_DEFAULT_REGION,endpoint_url=$AWS_ENDPOINT_URL"
      --cache-from "type=s3,bucket=$S3_BUCKET_NAME,name=$SERVICE-cache-$CI_COMMIT_REF_SLUG,region=$AWS_DEFAULT_REGION,endpoint_url=$AWS_ENDPOINT_URL"
      .
  after_script:
    - docker buildx rm "restaurant-bot-$CI_JOB_ID" || true
  tags:
    - $BUILD_TAG

deploy dev:
  stage: deploy
  interruptible: false
  resource_group: restaurant-bot-development
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    DOCKER_IMAGE: "$CI_DEV_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  before_script:
    - test -s "$ENV_DEV"
    - test -s "$GOOGLE_SERVICE_ACCOUNT_DEV"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - install -d -m 700 deploy/secrets
    - cp "$ENV_DEV" deploy/.env
    - cp "$GOOGLE_SERVICE_ACCOUNT_DEV" deploy/secrets/google-service-account.json
    - chmod 600 deploy/.env deploy/secrets/google-service-account.json
  script:
    - docker pull "$DOCKER_IMAGE"
    - docker compose --env-file deploy/.env -f deploy/docker-compose.host.yml -p "$DEV_COMPOSE_PROJECT" up -d --force-recreate --remove-orphans --wait --wait-timeout 180
    - >-
      docker compose --env-file deploy/.env -f deploy/docker-compose.host.yml
      -p "$DEV_COMPOSE_PROJECT" exec -T api
      python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)"
  environment:
    name: development
    url: $DEV_ENVIRONMENT_URL
  tags:
    - $DEV_TAG

deploy prod:
  stage: deploy
  interruptible: false
  resource_group: restaurant-bot-production
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+/'
      when: manual
  variables:
    DOCKER_IMAGE: "$CI_PROD_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  before_script:
    - test -s "$ENV_PROD"
    - test -s "$GOOGLE_SERVICE_ACCOUNT_PROD"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - install -d -m 700 deploy/secrets
    - cp "$ENV_PROD" deploy/.env
    - cp "$GOOGLE_SERVICE_ACCOUNT_PROD" deploy/secrets/google-service-account.json
    - chmod 600 deploy/.env deploy/secrets/google-service-account.json
  script:
    - docker pull "$DOCKER_IMAGE"
    - docker compose --env-file deploy/.env -f deploy/docker-compose.host.yml -p "$PROD_COMPOSE_PROJECT" up -d --force-recreate --remove-orphans --wait --wait-timeout 180
    - >-
      docker compose --env-file deploy/.env -f deploy/docker-compose.host.yml
      -p "$PROD_COMPOSE_PROJECT" exec -T api
      python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)"
  environment:
    name: production
    url: $PROD_ENVIRONMENT_URL
  tags:
    - $PROD_TAG
