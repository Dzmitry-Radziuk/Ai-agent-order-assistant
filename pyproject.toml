[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "restaurant-procurement-bot"
version = "1.0.0"
description = "Production Python replacement for the restaurant procurement n8n workflow"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.16,<2",
  "celery[redis]>=5.6,<6",
  "redis>=6.2,<7",
  "httpx>=0.28,<1",
  "openai>=2.45,<3",
  "google-api-python-client>=2.177,<3",
  "google-auth>=2.40,<3",
  "google-auth-httplib2>=0.2,<1",
  "structlog>=25.4,<26",
  "tenacity>=9.1,<10",
  "langfuse>=4.7,<5",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-mock>=3.14,<4",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-redis>=4.6,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D101", "D102", "D103", "D105", "D107", "D200", "D415"]
ignore = ["E501", "RUF001", "RUF002"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
